name: Moduvela CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline business engine
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trained model is reproducible and check held-out evaluation
        run: |
          node experiments/microai/training/train.mjs --check
          node experiments/microai/benchmark.mjs
          node experiments/microai/research/inference_candidates.mjs
          node experiments/microai/research/train_v2.mjs --check
          node experiments/microai/benchmark_v2.mjs
          node experiments/microai/training/design_evaluate.mjs
          node --test experiments/microai/training/*.test.mjs
      - name: Test browser MicroAI without packages or model APIs
        run: node --test experiments/microai/*.test.mjs
